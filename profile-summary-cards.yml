name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day at 00:00 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Personal access token stored as a repo secret named SUMMARY_GITHUB_TOKEN
          # (needed for private-contribution counts; GITHUB_TOKEN alone gives partial cards)
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 2 # South Africa (SAST)
